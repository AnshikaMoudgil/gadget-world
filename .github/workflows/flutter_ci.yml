name: Flutter CI

# Runs on every PR into dev or main, and on direct pushes to those branches.
# Adjust the branch list below if your workflow differs.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  analyze-and-build:
    name: Lint, Analyze, Test & Build
    runs-on: ubuntu-latest

    # Change this if your Flutter project lives somewhere else in the repo
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Create frontend environment file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$BACKEND_URL"
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            printf 'BACKEND_URL=%s\n' "$BACKEND_URL"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis (lint)
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Build Android App Bundle (release)
        run: flutter build appbundle --release

      - name: Build Web (release)
        run: flutter build web --release

      - name: Check Flutter dependency freshness
        run: flutter pub outdated --no-dev-dependencies

  backend-dart:
    name: Backend - Lint, Analyze & Test
    runs-on: ubuntu-latest
 
    # Change this if your Dart backend lives somewhere else in the repo
    defaults:
      run:
        working-directory: ./backend
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
 
      - name: Install dependencies
        run: dart pub get
 
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
 
      - name: Run static analysis (lint)
        run: dart analyze
 
      - name: Run tests
        if: hashFiles('backend/test/**') != ''
        run: dart test

      - name: Check backend dependency freshness
        run: dart pub outdated --no-dev-dependencies

  database-integration:
    name: Fresh Supabase Migration & Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start a fresh local Supabase stack
        run: supabase start

      - name: Reapply every migration from an empty database
        run: supabase db reset --local

      - name: Run database integration assertions
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -f supabase/tests/security_integration.sql

  backend-container:
    name: Backend Docker Build & Runtime Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag gadget-world-backend:ci ./backend

      - name: Run backend container
        run: |
          docker run --detach --name gadget-world-backend-ci --publish 18080:8080 \
            --env SUPABASE_URL=http://127.0.0.1:54321 \
            --env SUPABASE_PUBLISHABLE_KEY=ci-anon-key \
            --env SUPABASE_SECRET_KEY=ci-service-role-key \
            --env RAZORPAY_WEBHOOK_SECRET=ci-webhook-secret \
            --env ALLOWED_ORIGINS=https://shop.example.com \
            gadget-world-backend:ci

      - name: Verify container health endpoint
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs gadget-world-backend-ci
          exit 1

      - name: Stop backend container
        if: always()
        run: docker rm --force gadget-world-backend-ci

  admin-security:
    name: Admin Lint, Type Check & Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint admin application
        run: npm run lint

      - name: Type-check admin application
        run: npx tsc --noEmit

      - name: Build admin application with public client configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
