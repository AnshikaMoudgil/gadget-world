name: Flutter CI

# Runs on every PR into dev or main, and on direct pushes to those branches.
# Adjust the branch list below if your workflow differs.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  analyze-and-build:
    name: Lint, Analyze, Test & Build
    runs-on: ubuntu-latest

    # Change this if your Flutter project lives somewhere else in the repo
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Create frontend environment file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "${SUPABASE_URL:-https://xyzcompany.supabase.co}"
            printf 'SUPABASE_ANON_KEY=%s\n' "${SUPABASE_ANON_KEY:-public-anon-key}"
          } > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis (lint)
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK (debug)
        run: flutter build apk --debug

      - name: Build Web
        run: flutter build web

  backend-dart:
    name: Backend - Lint, Analyze & Test
    runs-on: ubuntu-latest
 
    # Change this if your Dart backend lives somewhere else in the repo
    defaults:
      run:
        working-directory: ./backend
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.12.2'
 
      - name: Install dependencies
        run: dart pub get
 
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
 
      - name: Run static analysis (lint)
        run: dart analyze
 
      - name: Run tests
        if: hashFiles('backend/test/**') != ''
        run: dart test
